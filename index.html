<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum Git & Web - LKPD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="judulUtama">Halaman Awal</h1>
    <nav>
      <a href="#">Beranda</a> |
      <a href="#">Tentang</a>
    </nav>
  </header>

  <main>
    <section>
      <div class="kartu-profil">
        <p>Profil Siswa</p>
      </div>
    </section>

    <section>
      <article>
        <div id="kotak-pesan">
          <p id="pesanStatus">Sedang Memuat...</p>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Tim Praktikum</p>
  </footer>

  <script>
    const judul = document.getElementById("judulUtama");
    if (judul) {
      judul.textContent = "Selamat Datang Siswa";
    }
    const pesan = document.getElementById("pesanStatus");
    if (pesan) {
      pesan.textContent = "Data Berhasil Disimpan";
    }
  </script>

</body>
</html>
